<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Повторение — Lexi</title>
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#15213b" />
<meta name="apple-mobile-web-app-title" content="Lexi" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
<link rel="stylesheet" href="/static/review.css" />
<link rel="stylesheet" href="/static/neon.css" />
<script>try{if(localStorage.getItem("lexi-theme")==="neon")document.documentElement.dataset.theme="neon"}catch(e){}</script>
</head>
<body>

  <header class="top">
    <div class="top-inner">
      <a href="/" class="logo"><span class="logo-card" aria-hidden="true"></span>Lexi</a>
      <nav class="nav-links">
        <a href="/">Картотека</a>
        <a href="/review">Повторение</a>
        <a href="/stats">Статистика</a>
      </nav>
    </div>
  </header>

  <main class="review-wrap">
    <div id="direction-select" hidden>
      <h1 class="review-title">Повторение</h1>
      <p id="due-banner" class="review-lead"></p>

      <h2 class="mode-heading">Переворачивать карточки</h2>
      <div class="mode-options">
        <button class="mode-option" data-direction="en-ru" data-mode="flip">
          <span class="mode-name">Английский — русский</span>
          <span class="mode-desc">Видите слово и вспоминаете перевод</span>
        </button>
        <button class="mode-option" data-direction="ru-en" data-mode="flip">
          <span class="mode-name">Русский — английский</span>
          <span class="mode-desc">Видите перевод и вспоминаете слово</span>
        </button>
      </div>

      <h2 class="mode-heading">Писать ответ</h2>
      <div class="mode-options">
        <button class="mode-option" data-direction="en-ru" data-mode="type">
          <span class="mode-name">Английский — русский</span>
          <span class="mode-desc">Пишете перевод, Lexi проверяет</span>
        </button>
        <button class="mode-option" data-direction="ru-en" data-mode="type">
          <span class="mode-name">Русский — английский</span>
          <span class="mode-desc">Пишете слово, Lexi проверяет</span>
        </button>
      </div>

      <h2 class="mode-heading">На слух</h2>
      <div class="mode-options">
        <button class="mode-option" data-direction="audio" data-mode="dictation">
          <span class="mode-name">Диктант</span>
          <span class="mode-desc">Слушаете слово и пишете его по-английски</span>
        </button>
      </div>
    </div>

    <div id="count-select" hidden>
      <button id="back-to-direction-btn" class="link-btn" type="button">Выбрать другой режим</button>
      <h1 class="review-title">Какие слова повторить?</h1>
      <div class="scope-toggle" id="scope-toggle" role="group" aria-label="Какие слова">
        <button class="scope-btn" data-scope="due" type="button">Пора повторить <span data-count-for="due"></span></button>
        <button class="scope-btn" data-scope="all" type="button">Все слова <span data-count-for="all"></span></button>
        <button class="scope-btn" data-scope="today" type="button">Добавленные сегодня <span data-count-for="today"></span></button>
      </div>
      <h2 class="mode-heading">Сколько карточек за раз</h2>
      <div id="count-grid" class="count-grid"></div>
    </div>

    <div id="review-session" hidden>
      <div class="session-bar">
        <span id="review-settings-label"></span>
        <button id="change-settings-btn" class="link-btn" type="button">Изменить</button>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="progress" class="progress-text">Загрузка…</p>
      <div id="review-card-area"></div>
      <p class="kbd-hint" id="kbd-hint"></p>
    </div>

    <div id="review-empty" class="review-empty" hidden>
      <div class="empty-text"></div>
      <div class="empty-actions"></div>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/cat.js"></script>
  <script src="/static/review.js"></script>
  <script src="/static/roam.js"></script>
  <script src="/static/particles.js"></script>
</body>
</html>
